<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전투력 측정기 — COMBAT POWER ANALYSIS SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ─── Reset & Base ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #00ff41;
    --green-dim: #00aa2b;
    --green-glow: rgba(0,255,65,0.35);
    --red: #ff3c00;
    --red-glow: rgba(255,60,0,0.4);
    --yellow: #ffd700;
    --bg: #0a0a0a;
    --panel: #0d1a0d;
    --border: #1a3a1a;
    --font: 'Share Tech Mono', 'Courier New', monospace;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--green);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ─── CRT Scanline Overlay ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ─── Flicker animation ─── */
  @keyframes flicker {
    0%   { opacity: 1; }
    92%  { opacity: 1; }
    93%  { opacity: 0.88; }
    94%  { opacity: 1; }
    96%  { opacity: 0.92; }
    100% { opacity: 1; }
  }
  @keyframes glow-pulse {
    0%, 100% { text-shadow: 0 0 8px var(--green), 0 0 20px var(--green-glow); }
    50%       { text-shadow: 0 0 4px var(--green), 0 0 10px var(--green-glow); }
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes count-fill { from { width: 0; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes godPulse {
    0%, 100% { text-shadow: 0 0 20px #fff, 0 0 40px #fff, 0 0 60px var(--green); color: #fff; }
    50%       { text-shadow: 0 0 40px #fff, 0 0 80px var(--green), 0 0 100px var(--green); color: var(--green); }
  }
  @keyframes scanLine {
    0%   { top: -10%; }
    100% { top: 110%; }
  }

  /* ─── Layout ─── */
  #app {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    animation: flicker 8s infinite;
    position: relative;
  }

  /* ─── Header ─── */
  .header {
    text-align: center;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }
  .header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 0.12em;
    animation: glow-pulse 3s ease-in-out infinite;
    text-shadow: 0 0 10px var(--green), 0 0 30px var(--green-glow);
  }
  .header .subtitle {
    font-size: 0.72rem;
    color: var(--green-dim);
    letter-spacing: 0.25em;
    margin-top: 6px;
  }
  .header .sys-info {
    font-size: 0.65rem;
    color: #2a5a2a;
    margin-top: 4px;
    letter-spacing: 0.1em;
  }

  /* ─── Scan Button ─── */
  .scan-btn {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 24px;
    padding: 16px 24px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    font-family: var(--font);
    font-size: 1.1rem;
    letter-spacing: 0.18em;
    cursor: pointer;
    position: relative;
    transition: all 0.15s ease;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-glow), inset 0 0 12px rgba(0,255,65,0.04);
  }
  .scan-btn:hover:not(:disabled) {
    background: rgba(0,255,65,0.08);
    box-shadow: 0 0 24px var(--green-glow), inset 0 0 20px rgba(0,255,65,0.07);
    letter-spacing: 0.22em;
  }
  .scan-btn:active:not(:disabled) {
    background: rgba(0,255,65,0.15);
  }
  .scan-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    letter-spacing: 0.18em;
  }

  /* ─── Status Bar ─── */
  .status-bar {
    background: #060f06;
    border: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 0.78rem;
    color: var(--green-dim);
    margin-bottom: 20px;
    min-height: 38px;
    letter-spacing: 0.05em;
  }
  .status-bar .cursor {
    display: inline-block;
    width: 8px;
    height: 13px;
    background: var(--green);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }

  /* ─── Word Display ─── */
  .word-display {
    text-align: center;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: 0.1em;
    margin: 20px 0;
    min-height: 68px;
    text-shadow: 0 0 16px var(--green), 0 0 40px var(--green-glow);
    display: none;
  }

  /* ─── Image Frame ─── */
  .image-frame {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 24px auto;
    display: none;
  }
  .image-frame .label {
    font-size: 0.65rem;
    letter-spacing: 0.28em;
    color: var(--green-dim);
    text-align: center;
    margin-bottom: 8px;
  }
  .image-viewport {
    position: relative;
    border: 1px solid var(--green-dim);
    background: #000;
    overflow: hidden;
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .image-viewport img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  /* Corner brackets */
  .corner { position: absolute; width: 18px; height: 18px; border-color: var(--green); border-style: solid; }
  .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  /* Scanning line */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--green), transparent);
    opacity: 0.7;
    animation: scanLine 2s linear infinite;
    display: none;
  }
  .image-viewport.scanning .scan-line { display: block; }
  .reticle-h, .reticle-v {
    position: absolute;
    background: rgba(0,255,65,0.15);
    pointer-events: none;
  }
  .reticle-h { left: 0; right: 0; top: 50%; height: 1px; }
  .reticle-v { top: 0; bottom: 0; left: 50%; width: 1px; }

  /* ─── Results Panel ─── */
  #results {
    display: none;
    animation: fadeIn 0.5s ease;
  }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    color: var(--green-dim);
    margin: 28px 0 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  /* Total Power */
  .total-power {
    text-align: center;
    margin: 20px 0;
  }
  .total-power .label { font-size: 0.72rem; letter-spacing: 0.25em; color: var(--green-dim); }
  .total-power .number {
    font-size: clamp(3rem, 10vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 0 20px var(--green), 0 0 60px var(--green-glow);
  }

  /* Rank */
  .rank-display {
    text-align: center;
    margin: 16px 0 28px;
  }
  .rank-badge {
    display: inline-block;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    letter-spacing: 0.15em;
    padding: 8px 32px;
    border: 2px solid currentColor;
  }
  .rank-E, .rank-D { color: var(--green-dim); border-color: var(--green-dim); text-shadow: 0 0 8px rgba(0,170,43,0.5); }
  .rank-C, .rank-B { color: var(--green); border-color: var(--green); text-shadow: 0 0 12px var(--green-glow); }
  .rank-A          { color: var(--yellow); border-color: var(--yellow); text-shadow: 0 0 16px rgba(255,215,0,0.5); }
  .rank-S          { color: var(--red); border-color: var(--red); text-shadow: 0 0 18px var(--red-glow); }
  .rank-SS, .rank-SSS { color: var(--red); border-color: var(--red); text-shadow: 0 0 24px var(--red-glow), 0 0 48px rgba(255,60,0,0.3); }
  .rank-god { animation: godPulse 2s ease-in-out infinite; border-color: #fff; }

  /* Dimension Bars */
  .dimensions { margin: 20px 0; }
  .dim-row { margin-bottom: 18px; }
  .dim-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
  .dim-name { color: var(--green-dim); letter-spacing: 0.08em; }
  .dim-score { color: var(--green); font-size: 0.9rem; }
  .bar-track {
    background: #0d180d;
    border: 1px solid var(--border);
    height: 14px;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(to right, var(--green-dim), var(--green));
    box-shadow: 0 0 8px var(--green-glow);
    transition: width 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .dim-comment {
    font-size: 0.68rem;
    color: #3a6a3a;
    font-style: italic;
    margin-top: 4px;
    letter-spacing: 0.03em;
  }

  /* Analysis / Verdict boxes */
  .report-box {
    background: #060f06;
    border: 1px solid var(--border);
    padding: 18px 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .report-box .box-label {
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    color: var(--green-dim);
    margin-bottom: 12px;
  }
  .report-box p {
    font-size: 0.82rem;
    color: #b0d0b0;
    line-height: 1.75;
    letter-spacing: 0.02em;
  }
  .verdict-box p {
    font-size: 0.92rem;
    color: var(--green);
    text-shadow: 0 0 6px var(--green-glow);
    line-height: 1.8;
  }

  /* ─── Bottom Buttons ─── */
  .bottom-btns {
    display: flex;
    gap: 16px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .btn-secondary {
    flex: 1;
    min-width: 140px;
    padding: 12px 20px;
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-family: var(--font);
    font-size: 0.82rem;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary:hover {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0,255,65,0.05);
  }

  /* ─── Responsive ─── */
  @media (max-width: 480px) {
    #app { padding: 20px 14px 40px; }
    .total-power .number { font-size: 3rem; }
    .rank-badge { font-size: 1.6rem; padding: 6px 20px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header">
    <h1>[ 전투력 측정기 ]</h1>
    <div class="subtitle">COMBAT POWER ANALYSIS SYSTEM v2.7</div>
    <div class="sys-info">AUTHORIZED PERSONNEL ONLY &nbsp;|&nbsp; CLASSIFICATION: TOP SECRET &nbsp;|&nbsp; NODE: KR-7749</div>
  </div>

  <!-- Main Scan Button -->
  <button class="scan-btn" id="scanBtn" onclick="startScan()">&#9654; 스캔 개시</button>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <span id="statusText">대기 중. 스캔을 개시하십시오.</span>
    <span class="cursor" id="cursor" style="display:none"></span>
  </div>

  <!-- Word Display -->
  <div class="word-display" id="wordDisplay"></div>

  <!-- Image Frame -->
  <div class="image-frame" id="imageFrame">
    <div class="label">▸ SPECIMEN DETECTED ◂</div>
    <div class="image-viewport" id="imageViewport">
      <div class="scan-line"></div>
      <div class="reticle-h"></div>
      <div class="reticle-v"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <img id="specimenImg" src="" alt="specimen">
    </div>
  </div>

  <!-- Results Panel -->
  <div id="results">
    <div class="section-label">▸ POWER LEVEL READING</div>

    <!-- Total Power -->
    <div class="total-power">
      <div class="label">TOTAL COMBAT POWER</div>
      <div class="number" id="totalPower">0</div>
    </div>

    <!-- Rank -->
    <div class="rank-display">
      <span class="rank-badge" id="rankBadge">—</span>
    </div>

    <!-- Dimension Bars -->
    <div class="section-label">▸ DIMENSIONAL ANALYSIS</div>
    <div class="dimensions" id="dimensions"></div>

    <!-- Analysis Report -->
    <div class="section-label">▸ DIAGNOSTIC REPORT</div>
    <div class="report-box">
      <div class="box-label">[ 분석 보고서 ]</div>
      <p id="analysisText"></p>
    </div>

    <!-- Verdict -->
    <div class="section-label">▸ OFFICIAL VERDICT</div>
    <div class="report-box verdict-box">
      <div class="box-label">[ 최종 판정 ]</div>
      <p id="verdictText"></p>
    </div>

    <!-- Bottom Buttons -->
    <div class="bottom-btns">
      <button class="btn-secondary" onclick="startScan()">&#9654; 재측정</button>
      <button class="btn-secondary" id="copyBtn" onclick="copyResult()">[ 결과 복사 ]</button>
    </div>
  </div>

</div><!-- #app -->

<script>
  // ─── State ───
  let currentWord = '';
  let currentResult = null;
  let fallbackUrls = [];
  let scanning = false;

  // ─── DOM Refs ───
  const scanBtn       = document.getElementById('scanBtn');
  const statusText    = document.getElementById('statusText');
  const cursor        = document.getElementById('cursor');
  const wordDisplay   = document.getElementById('wordDisplay');
  const imageFrame    = document.getElementById('imageFrame');
  const imageViewport = document.getElementById('imageViewport');
  const specimenImg   = document.getElementById('specimenImg');
  const resultsPanel  = document.getElementById('results');
  const totalPowerEl  = document.getElementById('totalPower');
  const rankBadge     = document.getElementById('rankBadge');
  const dimensionsEl  = document.getElementById('dimensions');
  const analysisEl    = document.getElementById('analysisText');
  const verdictEl     = document.getElementById('verdictText');

  // ─── Status helpers ───
  function setStatus(msg) {
    statusText.textContent = msg;
    cursor.style.display = 'inline-block';
  }
  function setStatusDone(msg) {
    statusText.textContent = msg;
    cursor.style.display = 'none';
  }

  // ─── Count-up animation ───
  function countUp(el, target, duration = 2000) {
    const start = performance.now();
    function step(now) {
      const progress = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.floor(ease * target).toLocaleString();
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ─── Rank styling ───
  const RANK_CLASS = {
    'E': 'rank-E', 'D': 'rank-D', 'C': 'rank-C', 'B': 'rank-B',
    'A': 'rank-A', 'S': 'rank-S', 'SS': 'rank-SS', 'SSS': 'rank-SSS',
    '신의 영역': 'rank-god',
  };

  // ─── Render results ───
  function renderResults(data) {
    resultsPanel.style.display = 'block';

    // Total power count-up
    countUp(totalPowerEl, data.total_power, 2000);

    // Rank badge
    rankBadge.textContent = 'RANK : ' + data.rank;
    rankBadge.className = 'rank-badge ' + (RANK_CLASS[data.rank] || 'rank-C');

    // Dimension bars
    dimensionsEl.innerHTML = '';
    data.dimensions.forEach((dim, i) => {
      const row = document.createElement('div');
      row.className = 'dim-row';
      row.innerHTML = `
        <div class="dim-header">
          <span class="dim-name">${dim.name}</span>
          <span class="dim-score" id="score-${i}">0</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="bar-${i}"></div></div>
        <div class="dim-comment">${dim.comment}</div>
      `;
      dimensionsEl.appendChild(row);
      // Animate bar after short delay
      setTimeout(() => {
        document.getElementById(`bar-${i}`).style.width = dim.score + '%';
        countUp(document.getElementById(`score-${i}`), dim.score, 1500);
      }, 200 + i * 120);
    });

    // Analysis
    analysisEl.textContent = data.analysis;

    // Verdict
    verdictEl.textContent = data.verdict;
  }

  // ─── Image loading with fallback ───
  async function loadImage(primary, fallbacks) {
    const urls = [primary, ...fallbacks];
    for (const url of urls) {
      try {
        await new Promise((resolve, reject) => {
          specimenImg.onload = resolve;
          specimenImg.onerror = reject;
          specimenImg.src = url;
        });
        return url; // success
      } catch {
        // try next
      }
    }
    throw new Error('모든 이미지 URL 로드 실패');
  }

  // ─── Main scan flow ───
  async function startScan() {
    if (scanning) return;
    scanning = true;
    scanBtn.disabled = true;

    // Reset UI
    resultsPanel.style.display = 'none';
    wordDisplay.style.display = 'none';
    imageFrame.style.display = 'none';
    specimenImg.src = '';
    currentResult = null;

    try {
      // Step 1: Get random word
      setStatus('>> 전투력 스캐너 가동 중...');
      await delay(600);
      setStatus('>> 무작위 피험체 선정 중...');
      const wordRes = await fetch('/api/random-word');
      if (!wordRes.ok) throw new Error('단어 수신 실패');
      const { word } = await wordRes.json();
      currentWord = word;

      wordDisplay.textContent = '[ ' + word + ' ]';
      wordDisplay.style.display = 'block';
      await delay(400);

      // Step 2: Search image
      setStatus('>> 이미지 데이터 수신 중...');
      imageFrame.style.display = 'block';
      imageViewport.classList.add('scanning');

      const imgSearchRes = await fetch('/api/search-image?word=' + encodeURIComponent(word));
      if (!imgSearchRes.ok) {
        const err = await imgSearchRes.json();
        throw new Error(err.error || '이미지 검색 실패');
      }
      const { imageUrl, fallbackUrls: fbs } = await imgSearchRes.json();
      fallbackUrls = fbs || [];

      // Load image
      const loadedUrl = await loadImage(imageUrl, fallbackUrls);
      imageViewport.classList.remove('scanning');

      // Step 3: Analyze
      setStatus('>> AI 전투력 분석 엔진 가동...');
      await delay(300);
      setStatus('>> 수치 연산 중... 경고: 비정상적 에너지 감지');

      const analyzeRes = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageUrl: loadedUrl }),
      });
      if (!analyzeRes.ok) {
        const err = await analyzeRes.json();
        throw new Error(err.error || 'AI 분석 실패');
      }
      const data = await analyzeRes.json();
      currentResult = { word, data };

      setStatusDone('>> 분석 완료. 결과를 출력합니다.');
      await delay(400);

      renderResults(data);

    } catch (err) {
      imageViewport.classList.remove('scanning');
      setStatusDone('>> [오류] ' + err.message);
      console.error(err);
    } finally {
      scanning = false;
      scanBtn.disabled = false;
    }
  }

  // ─── Copy result ───
  function copyResult() {
    if (!currentResult) return;
    const { word, data } = currentResult;
    const dims = data.dimensions.map(d => `  ${d.name}: ${d.score}/100 — ${d.comment}`).join('\n');
    const text = [
      '=== 전투력 측정기 분석 결과 ===',
      `피험체: ${word}`,
      `총 전투력: ${data.total_power.toLocaleString()}`,
      `등급: ${data.rank}`,
      '',
      '[ 세부 수치 ]',
      dims,
      '',
      '[ 분석 보고서 ]',
      data.analysis,
      '',
      '[ 최종 판정 ]',
      data.verdict,
      '',
      'COMBAT POWER ANALYSIS SYSTEM v2.7',
    ].join('\n');

    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      const orig = btn.textContent;
      btn.textContent = '[ 복사 완료 ]';
      setTimeout(() => btn.textContent = orig, 1800);
    });
  }

  function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }
</script>
</body>
</html>
